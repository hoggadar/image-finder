services:
  api-gateway:
    container_name: api-gateway
    build:
      context: backend/api-gateway/
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - image-finder-network
  
  clip:
    container_name: clip-service
    build:
      context: backend/clip-service/
      dockerfile: Dockerfile
    ports:
      - "7070:8080"
    networks:
      - image-finder-network

  auth:
    container_name: auth-service
    build:
      context: backend/auth-service/
      dockerfile: Dockerfile
    ports:
      - "6060:8080"
    networks:
      - image-finder-network
  
  upload:
    container_name: upload-service
    build: path

  image-loader:
    container_name: image-loader-service
    build: path

  vector-loader:
    container_name: vector-loader-service
    build: path
  
  search:
    container_name: search-service
    build: path

  postgres:
    image: postgres:16
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hoggadar
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ifinder_auth
    networks:
      - image-finder-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
  
  minio:
    image: minio/minio:latest
    container_name: minio-s3
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    networks:
      - image-finder-network
    volumes:
      - minio-data:/data
  
  qdrant:
    image: image
    container_name: vector-loader-service-qdrant
  
  rabbitmq:
    image: rabbitmq:4-management
    container_name: message-broker-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - image-finder-network
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/data

  image-storage:
    container_name: image-storage
    build: path
  
  vector-db:
    container_name: vector-db
    build: path
  

   

networks:
  image-finder-network:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data: